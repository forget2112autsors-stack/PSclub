# PS Klub — API konteyneri.
#
# Baza bu yerda emas: PostgreSQL Supabase'da turadi (TZ 7.2 dagi "faqat bulut"
# qaroriga muvofiq). Shuning uchun `db` xizmati yo'q — ulanish .env dagi
# DATABASE_URL orqali beriladi.
#
#   docker compose up -d --build

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
      # Faqat birinchi `npm run seed` da o'qiladi.
      PSKLUB_CLUB_NAME: ${PSKLUB_CLUB_NAME:-PS Klub}
      PSKLUB_OPERATOR_PIN: ${PSKLUB_OPERATOR_PIN:-}
      PSKLUB_ADMIN_PIN: ${PSKLUB_ADMIN_PIN:-}
      PSKLUB_OWNER_PIN: ${PSKLUB_OWNER_PIN:-}
    ports:
      - '3000:3000'
